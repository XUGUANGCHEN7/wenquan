[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wenquan-device-service"
version = "0.1.0"
description = "Outbound-only Windows device task worker with replaceable adapter"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wenquan_device_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
